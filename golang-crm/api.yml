openapi: 3.0.3
info: {title: CRM Service API, description: Customer CRUD API., version: 1.0.0}
servers: [{url: http://localhost:8080}]
paths:
  /api/v1/customers:
    get:
      summary: List customers
      operationId: listCustomers
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1}}, {name: offset, in: query, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Success, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Customer'}}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '500': {$ref: '#/components/responses/ServerError'}}
    post:
      summary: Create customer
      operationId: createCustomer
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerRequest'}}}}
      responses: {'201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/v1/customers/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
    get:
      summary: Get customer by ID
      operationId: getCustomerByID
      responses: {'200': {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/ServerError'}}
    put:
      summary: Update customer by ID
      operationId: updateCustomer
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CustomerRequest'}}}}
      responses: {'200': {description: Updated, content: {application/json: {schema: {$ref: '#/components/schemas/Customer'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/ServerError'}}
    delete:
      summary: Delete customer by ID
      operationId: deleteCustomer
      responses: {'204': {description: Deleted}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/v1/orders:
    get:
      summary: Get orders by parameters
      operationId: getOrderByParams
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1}}, {name: offset, in: query, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Success, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Order'}}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/v1/customers/{customerId}/orders:
    get:
      summary: Get orders by customer ID
      operationId: getOrdersByCustomer
      parameters: [{name: customerId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Success, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Order'}}}}}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/v1/orders/{id}:
    get:
      summary: Get order by ID
      operationId: getOrderById
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/Order'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/v1/products:
    get:
      summary: Get products by parameters
      operationId: getProductByParams
      parameters: [{name: limit, in: query, schema: {type: integer, minimum: 1}}, {name: offset, in: query, schema: {type: integer, minimum: 0}}]
      responses: {'200': {description: Success, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Product'}}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '500': {$ref: '#/components/responses/ServerError'}}
  /api/v1/products/{id}:
    get:
      summary: Get product by ID
      operationId: getProductById
      parameters: [{name: id, in: path, required: true, schema: {type: integer, format: int64}}]
      responses: {'200': {description: Success, content: {application/json: {schema: {$ref: '#/components/schemas/Product'}}}}, '404': {$ref: '#/components/responses/NotFound'}, '500': {$ref: '#/components/responses/ServerError'}}
components:
  schemas:
    Customer: {type: object, required: [id, name, email], properties: {id: {type: string, format: uuid}, name: {type: string}, email: {type: string, format: email}, city: {type: string, nullable: true}}}
    CustomerRequest: {type: object, required: [name, email], properties: {name: {type: string}, email: {type: string, format: email}, city: {type: string, nullable: true}}}
    Order: {type: object, properties: {id: {type: string}, customerId: {type: string}, status: {type: string}, total: {type: number, format: double}, items: {type: array, items: {type: object}}}}
    Product: {type: object, properties: {id: {type: integer, format: int64}, name: {type: string}, category: {type: string}, unitPrice: {type: number}, cost: {type: number}, discontinued: {type: boolean}, stock: {type: integer}}}
    Error: {type: object, required: [error], properties: {error: {type: string}}}
  responses:
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    NotFound: {description: Customer not found, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
    ServerError: {description: Internal server error, content: {application/json: {schema: {$ref: '#/components/schemas/Error'}}}}
